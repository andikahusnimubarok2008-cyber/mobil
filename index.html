<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Classic Racer</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =====================
     HUD
===================== -->

<div id="hud">

    <div>
        🚗 Speed :
        <span id="speed">0</span>
        km/h
    </div>


    <div>
        🔥 RPM :
        <span id="rpm">800</span>
    </div>


    <div>
        🏁 Score :
        <span id="score">0</span>
    </div>


    <div>
        👑 High :
        <span id="high">0</span>
    </div>


</div>



<!-- =====================
     GAME CANVAS
===================== -->

<canvas id="game"></canvas>




<!-- =====================
     TOUCH CONTROL
===================== -->


<div id="controls">


    <!-- BELAKANG KIRI -->

    <div class="steering">

        <button id="left">
            ⬅
        </button>


        <button id="right">
            ➡
        </button>


    </div>




    <!-- BELAKANG KANAN -->

    <div class="driving">


        <button id="gas">
            ⬆
        </button>


        <button id="brake">
            ⬇
        </button>


    </div>



</div>






<!-- =====================
     GAME OVER
===================== -->


<div id="gameOver">


    <h1>
        GAME OVER
    </h1>


    <p>
        Score
    </p>


    <h2 id="finalScore">
        0
    </h2>


    <button id="restartBtn">
        Main Lagi
    </button>


</div>





<script src="script.js"></script>


</body>

</html>
